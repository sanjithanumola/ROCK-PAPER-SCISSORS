<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROCK • PAPER • SCISSORS — Shoot!</title>
<style>
:root{--bg:#0a0a0d;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--txt:#f2f0ec;--dim:#8d8b98;--win:#3ee6a0;--lose:#ff5a6e;--draw:#ffc857;--acc:#8b7bff}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(1200px 700px at 15% -10%,#1d1838 0,transparent 60%),radial-gradient(900px 600px at 100% 110%,#0f2a30 0,transparent 60%),var(--bg);color:var(--txt);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow-x:hidden;position:relative}
.bg span{position:fixed;border-radius:50%;filter:blur(50px);opacity:.28;animation:float 18s ease-in-out infinite;pointer-events:none;z-index:0}
.bg span:nth-child(1){width:260px;height:260px;background:#6a4cff;left:-60px;top:15%}
.bg span:nth-child(2){width:220px;height:220px;background:#12b5a6;right:-50px;top:50%;animation-delay:-6s}
.bg span:nth-child(3){width:160px;height:160px;background:#ff4f7b;left:45%;bottom:-60px;animation-delay:-11s}
.dots i{position:fixed;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.25;animation:rise 14s linear infinite;z-index:0}
.dots i:nth-child(1){left:12%;animation-delay:0s}.dots i:nth-child(2){left:30%;animation-delay:-4s}.dots i:nth-child(3){left:52%;animation-delay:-8s}.dots i:nth-child(4){left:73%;animation-delay:-2s}.dots i:nth-child(5){left:90%;animation-delay:-10s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
@keyframes rise{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:20px}
header{text-align:center}
h1{font-size:clamp(1.7rem,6vw,3.4rem);font-weight:900;letter-spacing:.06em;background:linear-gradient(100deg,#fff 10%,#b9afff 50%,#7be8d2 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(139,123,255,.35))}
h1 b{color:var(--acc);-webkit-text-fill-color:var(--acc)}
.sub{font-size:clamp(1.1rem,3.5vw,1.6rem);font-style:italic;font-weight:700;color:var(--draw);letter-spacing:.3em;margin-top:4px;text-shadow:0 0 18px rgba(255,200,87,.5)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.score div{text-align:center;padding:8px 4px}
.score small{display:block;color:var(--dim);letter-spacing:.15em;font-size:.72rem}
.score strong{display:inline-block;font-size:clamp(1.8rem,6vw,2.8rem);font-variant-numeric:tabular-nums}
#sY{color:var(--win)}#sC{color:var(--lose)}#sD{color:var(--draw)}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.35)}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:.9rem;margin-top:-6px}
.battle{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:22px 16px}
.side{text-align:center}
.side h2{font-size:.85rem;letter-spacing:.25em;color:var(--dim);margin-bottom:10px}
.card{height:clamp(120px,22vw,170px);border-radius:20px;border:1px solid var(--line);background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:clamp(3.4rem,10vw,5.2rem);transition:box-shadow .3s,border-color .3s}
.card .lbl{display:block;font-size:.8rem;letter-spacing:.2em;color:var(--dim);margin-top:2px;text-align:center}
.card.win{border-color:var(--win);box-shadow:0 0 30px rgba(62,230,160,.45)}
.card.lose{border-color:var(--lose);box-shadow:0 0 30px rgba(255,90,110,.35)}
.card.draw{border-color:var(--draw);box-shadow:0 0 30px rgba(255,200,87,.35)}
.card.think .e{animation:think .35s steps(1) infinite}
.card.pop .e{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes think{0%{opacity:.5;transform:rotate(-10deg)}33%{opacity:1;transform:rotate(10deg)}66%{opacity:.6;transform:rotate(0)}}
@keyframes pop{from{transform:scale(.3) rotate(-25deg);opacity:0}}
.vs{font-weight:900;font-size:1.3rem;color:var(--dim);letter-spacing:.1em}
.banner{text-align:center;padding:16px;font-size:clamp(1.4rem,5vw,2.2rem);font-weight:900;letter-spacing:.08em;min-height:74px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.banner.win{color:var(--win);box-shadow:0 0 34px rgba(62,230,160,.25)}
.banner.lose{color:var(--lose);box-shadow:0 0 34px rgba(255,90,110,.22)}
.banner.draw{color:var(--draw);box-shadow:0 0 34px rgba(255,200,87,.22)}
.banner.idle{color:var(--dim);font-size:1.05rem;font-weight:600;letter-spacing:.04em}
.banner.show .t{animation:slide .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes slide{from{transform:translateY(20px) scale(.9);opacity:0}}
button{font:inherit;color:inherit;cursor:pointer}
.again{display:none;background:var(--txt);color:#111;border:0;border-radius:999px;padding:8px 22px;font-weight:800;font-size:.95rem;transition:transform .15s}
.again.on{display:inline-block}
.again:hover{transform:scale(1.06)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{padding:18px 8px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:120px;transition:transform .18s,box-shadow .25s,border-color .25s}
.choice .e{font-size:clamp(2.4rem,8vw,3.4rem)}
.choice .n{font-weight:800;letter-spacing:.14em;font-size:clamp(.72rem,2.6vw,.95rem)}
.choice:hover:not(:disabled){transform:translateY(-4px) scale(1.04);border-color:var(--acc);box-shadow:0 10px 34px rgba(139,123,255,.35)}
.choice:active:not(:disabled){transform:scale(.95)}
.choice.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(139,123,255,.5),0 0 36px rgba(139,123,255,.55)}
.choice:disabled{cursor:wait;opacity:.55}
:focus-visible{outline:3px solid var(--draw);outline-offset:3px}
.hist{padding:16px}
.hist h3{font-size:.85rem;letter-spacing:.2em;color:var(--dim);margin-bottom:10px}
.hist ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.28);font-size:.92rem}
.hist li span:first-child{color:var(--dim)}
.tag{font-weight:800;font-size:.8rem;letter-spacing:.1em}
.tag.win{color:var(--win)}.tag.lose{color:var(--lose)}.tag.draw{color:var(--draw)}
.hist .empty{color:var(--dim);display:block;text-align:center}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:700;transition:border-color .2s,transform .15s}
.pill:hover{border-color:var(--acc);transform:translateY(-2px)}
.hint{text-align:center;color:var(--dim);font-size:.85rem;letter-spacing:.1em}
@media(max-width:600px){
 .battle{grid-template-columns:1fr;gap:10px}
 .vs{padding:2px 0}
 .card{height:120px}
 .hist li{grid-template-columns:auto 1fr auto;font-size:.85rem}
 .hist li span:nth-child(3){grid-column:2;grid-row:2}
 .hist li .tag{grid-row:1/3;grid-column:3}
 .choices{gap:8px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<main>
 <header>
  <h1>ROCK <b>•</b> PAPER <b>•</b> SCISSORS</h1>
  <div class="sub">Shoot!</div>
 </header>

 <section class="glass score" aria-label="Scoreboard">
  <div><small>YOU</small><strong id="sY">0</strong></div>
  <div><small>COMPUTER</small><strong id="sC">0</strong></div>
  <div><small>DRAWS</small><strong id="sD">0</strong></div>
 </section>
 <div class="meta"><span>Rounds Played: <b id="rounds">0</b></span><button class="pill" id="soundBtn" aria-pressed="true">🔊 Sound ON</button></div>

 <section class="glass battle" aria-label="Battle area">
  <div class="side"><h2>YOU</h2><div class="card" id="pCard"><div><span class="e">❔</span></div></div></div>
  <div class="vs">VS</div>
  <div class="side"><h2>COMPUTER</h2><div class="card" id="cCard"><div><span class="e">❔</span></div></div></div>
 </section>

 <section class="glass banner idle" id="banner" aria-live="polite">
  <div class="t" id="resText">Pick your move to start</div>
  <button class="again" id="againBtn">Play Again</button>
 </section>

 <section class="choices" aria-label="Choose your move">
  <button class="choice" data-c="rock" aria-label="Rock (R)"><span class="e">🪨</span><span class="n">ROCK</span></button>
  <button class="choice" data-c="paper" aria-label="Paper (P)"><span class="e">📄</span><span class="n">PAPER</span></button>
  <button class="choice" data-c="scissors" aria-label="Scissors (S)"><span class="e">✂️</span><span class="n">SCISSORS</span></button>
 </section>
 <div class="hint">Keyboard: R • P • S</div>

 <section class="glass hist" aria-label="Recent rounds">
  <h3>RECENT ROUNDS</h3>
  <ul id="hist"><li class="empty"><span class="empty">No rounds yet</span></li></ul>
 </section>

 <div class="foot"><button class="pill" id="resetBtn">Reset Game</button></div>
</main>

<script>
(function(){
 var EMOJI={rock:"🪨",paper:"📄",scissors:"✂️"};
 var NAME={rock:"Rock",paper:"Paper",scissors:"Scissors"};
 var BEATS={rock:"scissors",scissors:"paper",paper:"rock"};
 var state={you:0,cpu:0,draw:0,rounds:0,history:[],busy:false,sound:true};
 var $=function(id){return document.getElementById(id)};
 var choiceBtns=document.querySelectorAll(".choice");
 var actx=null,timer=null,thinkTimer=null;

 /* ---------- sound ---------- */
 function tone(freq,start,dur,type,vol){
  if(!state.sound)return;
  try{
   actx=actx||new (window.AudioContext||window.webkitAudioContext)();
   if(actx.state==="suspended")actx.resume();
   var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+start;
   o.type=type||"sine";o.frequency.setValueAtTime(freq,t);
   g.gain.setValueAtTime(0.0001,t);
   g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.01);
   g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
   o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
 }
 function sfx(kind){
  if(kind==="click")tone(520,0,.08,"triangle",.04);
  else if(kind==="win"){tone(523,0,.14,"sine",.05);tone(659,.12,.14,"sine",.05);tone(784,.24,.22,"sine",.05)}
  else if(kind==="lose"){tone(330,0,.16,"sine",.05);tone(247,.14,.26,"sine",.05)}
  else if(kind==="draw"){tone(440,0,.12,"sine",.04);tone(440,.14,.12,"sine",.04)}
 }

 /* ---------- core logic ---------- */
 function getComputerChoice(){
  var opts=["rock","paper","scissors"];
  var n;
  if(window.crypto&&crypto.getRandomValues){
   var a=new Uint32Array(1);
   do{crypto.getRandomValues(a)}while(a[0]>=4294967295-(4294967295%3));
   n=a[0]%3;
  }else n=Math.floor(Math.random()*3);
  return opts[n];
 }
 function determineWinner(p,c){
  if(p===c)return "draw";
  return BEATS[p]===c?"win":"lose";
 }
 function updateScore(result){
  state.rounds++;
  var id;
  if(result==="win"){state.you++;id="sY"}
  else if(result==="lose"){state.cpu++;id="sC"}
  else{state.draw++;id="sD"}
  $("sY").textContent=state.you;$("sC").textContent=state.cpu;$("sD").textContent=state.draw;
  $("rounds").textContent=state.rounds;
  var el=$(id);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
 }
 function renderHistory(){
  var ul=$("hist");
  if(!state.history.length){ul.innerHTML='<li class="empty"><span class="empty">No rounds yet</span></li>';return}
  ul.innerHTML="";
  state.history.forEach(function(h){
   var li=document.createElement("li");
   var label=h.result==="win"?"WIN":h.result==="lose"?"LOSS":"DRAW";
   li.innerHTML='<span>Round '+h.n+'</span><span>YOU: '+NAME[h.p]+'</span><span>CPU: '+NAME[h.c]+'</span><span class="tag '+h.result+'">'+label+'</span>';
   ul.appendChild(li);
  });
 }
 function setCard(el,emoji,label,cls,pop){
  el.className="card"+(cls?" "+cls:"");
  el.innerHTML='<div><span class="e">'+emoji+'</span><span class="lbl">'+(label||"")+'</span></div>';
  if(pop){el.classList.add("pop")}
 }
 function setBanner(text,cls,showAgain){
  var b=$("banner");
  b.className="glass banner "+cls;
  $("resText").textContent=text;
  $("againBtn").classList.toggle("on",!!showAgain);
  void b.offsetWidth;b.classList.add("show");
 }
 function lock(v){
  state.busy=v;
  choiceBtns.forEach(function(b){b.disabled=v});
 }

 function playGame(choice){
  if(state.busy||!EMOJI[choice])return;
  lock(true);sfx("click");
  choiceBtns.forEach(function(b){b.classList.toggle("sel",b.dataset.c===choice)});
  setCard($("pCard"),EMOJI[choice],NAME[choice].toUpperCase(),"",true);
  setCard($("cCard"),"🤔","THINKING…","think");
  setBanner("Computer is choosing…","idle",false);
  var computer=getComputerChoice(); // chosen randomly, revealed after the delay
  timer=setTimeout(function(){
   var result=determineWinner(choice,computer);
   var pc=result==="win"?"win":result==="lose"?"lose":"draw";
   var cc=result==="win"?"lose":result==="lose"?"win":"draw";
   setCard($("pCard"),EMOJI[choice],NAME[choice].toUpperCase(),pc,false);
   setCard($("cCard"),EMOJI[computer],NAME[computer].toUpperCase(),cc,true);
   updateScore(result);
   state.history.unshift({n:state.rounds,p:choice,c:computer,result:result});
   state.history=state.history.slice(0,5);
   renderHistory();
   setBanner(result==="win"?"YOU WIN!":result==="lose"?"COMPUTER WINS!":"IT'S A DRAW!",pc,true);
   sfx(result);
   lock(false);
   $("againBtn").focus({preventScroll:true});
  },900);
 }

 function playAgain(){
  if(state.busy)return;
  setCard($("pCard"),"❔","");
  setCard($("cCard"),"❔","");
  choiceBtns.forEach(function(b){b.classList.remove("sel")});
  setBanner("Pick your move to start","idle",false);
 }
 function resetGame(){
  clearTimeout(timer);
  state.you=state.cpu=state.draw=state.rounds=0;
  state.history=[];
  ["sY","sC","sD"].forEach(function(i){$(i).textContent="0"});
  $("rounds").textContent="0";
  renderHistory();
  lock(false);
  playAgain();
 }

 /* ---------- events ---------- */
 choiceBtns.forEach(function(b){b.addEventListener("click",function(){playGame(b.dataset.c)})});
 $("againBtn").addEventListener("click",function(){sfx("click");playAgain()});
 $("resetBtn").addEventListener("click",function(){sfx("click");resetGame()});
 $("soundBtn").addEventListener("click",function(){
  state.sound=!state.sound;
  this.textContent=state.sound?"🔊 Sound ON":"🔇 Sound OFF";
  this.setAttribute("aria-pressed",state.sound);
  sfx("click");
 });
 document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  var k=e.key.toLowerCase();
  var map={r:"rock",p:"paper",s:"scissors"};
  if(map[k]){e.preventDefault();playGame(map[k])}
 });

 window.playGame=playGame;window.getComputerChoice=getComputerChoice;
 window.determineWinner=determineWinner;window.updateScore=updateScore;window.resetGame=resetGame;
 renderHistory();
})();
</script>
</body>
</html>
